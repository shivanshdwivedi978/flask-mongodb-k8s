apiVersion: v1
kind: Service
metadata:
  name: flask-service
  labels:
    app: flask-app
spec:
  # NodePort makes the service reachable outside the cluster via Minikube IP / Node IP
  type: NodePort
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30005
      name: http
  selector:
    app: flask-app
