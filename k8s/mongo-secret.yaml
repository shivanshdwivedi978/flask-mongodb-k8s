apiVersion: v1
kind: Secret
metadata:
  name: mongo-secret
  labels:
    app: mongodb
type: Opaque
stringData:
  # Root database administrative credentials
  mongo-root-username: "admin"
  mongo-root-password: "password123"
  mongo-database: "flask_db"
  # Standard MongoDB authenticated connection string for cluster-internal DNS
  mongo-uri: "mongodb://admin:password123@mongodb-service:27017/flask_db?authSource=admin"
